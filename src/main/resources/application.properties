spring.application.name=login_gcp

# Cloud Run provides the port via the PORT env var (defaults to 8080)
server.port=${PORT:8080}

# Resolved from the GOOGLE_CLOUD_PROJECT env var, falls back to the project id below
firebase.project-id=${GOOGLE_CLOUD_PROJECT:login-gcp-backend}

# Firebase Web API key, used by the login endpoint to call Identity Toolkit's signInWithPassword
firebase.api-key=${FIREBASE_API_KEY}

# SMTP settings used to send registration confirmation codes
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM}