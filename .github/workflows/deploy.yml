name: Deploy to Cloud Run

# A merged Pull Request results in a push to the base branch, so this
# effectively deploys only when a PR is merged into main.
on:
  push:
    branches:
      - main

env:
  SERVICE: login-gcp
  REGION: europe-west3
  PROJECT_ID: login-gcp-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation (keyless auth to GCP).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated
